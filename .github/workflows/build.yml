name: Build

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore
      
    - name: Run tests
      run: dotnet test ./tests/BlackJackQueen.Tests/BlackJackQueen.Tests.csproj --no-restore --verbosity normal

    - name: Build Docker image
      run: docker build -t blackjackqueen:latest .
